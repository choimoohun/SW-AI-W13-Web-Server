# C-05 설정. 우선순위: 기본값 -> 이 파일 -> CLI(-p/-r/-c).
port = 8080
doc_root = ./www
workers = 4
keepalive_max = 100
backend_timeout = 5
cdn_ttl = 60

# FR-07 리버스 프록시 라우트: prefix|backend1,backend2,...
# 백엔드가 2대 이상이면 Round-Robin.
route = /api/cache/|127.0.0.1:8000
route = /api/stocks/|127.0.0.1:8002
route = /api/orders/|127.0.0.1:8401,127.0.0.1:8402
