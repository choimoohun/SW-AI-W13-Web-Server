# 데모용 설정 — 항공 서비스 관련 기능만 남겼다.
# 실험용(이전 주차 mini-redis·mini-dbms) 라우트는 conf/backends.experimental.conf에 있다.
port = 8085
doc_root = ./www
workers = 4
keepalive_max = 100
backend_timeout = 5
cdn_ttl = 60

# route = prefix|backend...|rewrite
route = /api/payments/|127.0.0.1:8500|/
route = /api/airports/|127.0.0.1:8601,127.0.0.1:8602|/
route = /api/notifications/|127.0.0.1:8800|/
route = /api/mq/|127.0.0.1:8700|/
