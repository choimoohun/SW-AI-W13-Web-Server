# 실험용 백엔드(이전 주차 mini-redis·mini-dbms)를 포함한 설정.
# 데모에서는 conf/backends.conf를 쓰고, tests/integration/backend_services.sh만 이 파일을 쓴다.
port = 8085
doc_root = ./www
workers = 4
keepalive_max = 100
backend_timeout = 5
cdn_ttl = 60

# route = prefix|backend...|rewrite
route = /api/cache/|127.0.0.1:8000|/
route = /api/stocks/|127.0.0.1:8002|/
route = /api/orders/|127.0.0.1:8401,127.0.0.1:8402|/
route = /api/payments/|127.0.0.1:8500|/
route = /api/airports/|127.0.0.1:8601,127.0.0.1:8602|/
route = /api/notifications/|127.0.0.1:8800|/
route = /api/mq/|127.0.0.1:8700|/
