<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Noto Sans CJK KR, Apple SD Gothic Neo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1200" height="580" fill="#ffffff"/>
  <text x="30" y="44" font-size="32" font-weight="700" fill="#1f2937">연결을 기다리는 세 가지 방식</text>
  <text x="30" y="72" font-size="18" fill="#6b7280">회색 = 기다림, 파랑 = 처리, 빨강 ▼ = 손님의 HTTP 요청(바이트)이 도착</text>

  <!-- legend-free column headers -->
  <text x="290" y="100" font-size="17" fill="#6b7280">스레드 / 워커가 하는 일 (시간 →)</text>
  <text x="935" y="100" font-size="17" fill="#6b7280">결과</text>

  <!-- ===== Row 1: thread per connection ===== -->
  <rect x="20" y="112" width="1160" height="140" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="168" font-size="24" font-weight="700" fill="#111827">① 연결마다 스레드</text>
  <text x="40" y="194" font-size="19" fill="#6b7280">블로킹</text>

  <g font-size="16" fill="#374151">
    <text x="290" y="141">스레드1 · 손님 A</text>
    <text x="290" y="181">스레드2 · 손님 B</text>
    <text x="290" y="221">스레드3 · 손님 C</text>
  </g>
  <g>
    <rect x="410" y="124" width="300" height="26" rx="5" fill="#d1d5db"/>
    <text x="560" y="142" font-size="16" text-anchor="middle" fill="#374151">recv()에서 대기</text>
    <rect x="710" y="124" width="60" height="26" rx="5" fill="#3b82f6"/>
    <text x="740" y="142" font-size="16" text-anchor="middle" fill="#fff">처리</text>

    <rect x="410" y="164" width="200" height="26" rx="5" fill="#d1d5db"/>
    <text x="510" y="182" font-size="16" text-anchor="middle" fill="#374151">대기</text>
    <rect x="610" y="164" width="60" height="26" rx="5" fill="#3b82f6"/>
    <text x="640" y="182" font-size="16" text-anchor="middle" fill="#fff">처리</text>

    <rect x="410" y="204" width="400" height="26" rx="5" fill="#d1d5db"/>
    <text x="610" y="222" font-size="16" text-anchor="middle" fill="#374151">대기</text>
    <rect x="810" y="204" width="60" height="26" rx="5" fill="#3b82f6"/>
    <text x="840" y="222" font-size="16" text-anchor="middle" fill="#fff">처리</text>
  </g>
  <text x="935" y="164" font-size="19" font-weight="700" fill="#b91c1c">스레드가 연결 수만큼</text>
  <text x="935" y="190" font-size="17" fill="#374151">수만 개 연결(C10K)이면</text>
  <text x="935" y="210" font-size="17" fill="#374151">메모리·컨텍스트 스위칭 비용 ↑</text>

  <!-- ===== Row 2: non-blocking polling ===== -->
  <rect x="20" y="268" width="1160" height="130" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="324" font-size="24" font-weight="700" fill="#111827">② 계속 물어보기</text>
  <text x="40" y="350" font-size="19" fill="#6b7280">논블로킹</text>
  <text x="290" y="330" font-size="16" fill="#374151">워커 1개</text><text x="290" y="350" font-size="15" fill="#6b7280">A→B→C 순회</text>

  <g font-size="15" text-anchor="middle">
    <rect x="410" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="427" y="337" fill="#374151">A?</text>
    <rect x="452" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="469" y="337" fill="#374151">B?</text>
    <rect x="494" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="511" y="337" fill="#374151">C?</text>
    <rect x="536" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="553" y="337" fill="#374151">A?</text>
    <rect x="578" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="595" y="337" fill="#374151">B?</text>
    <rect x="620" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="637" y="337" fill="#374151">C?</text>
    <rect x="662" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="679" y="337" fill="#374151">A?</text>
    <rect x="704" y="318" width="60" height="28" rx="5" fill="#3b82f6"/><text x="734" y="337" fill="#fff">A 처리</text>
    <rect x="772" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="789" y="337" fill="#374151">B?</text>
    <rect x="814" y="318" width="34" height="28" rx="5" fill="#d1d5db"/><text x="831" y="337" fill="#374151">C?</text>
  </g>
  <text x="410" y="300" font-size="16" fill="#6b7280">"왔어?" → "아직" (헛질문)</text>
  <!-- arrival marker -->
  <path d="M 598 302 l 16 0 l -8 12 z" fill="#dc2626"/>
  <text x="620" y="300" font-size="15" fill="#dc2626">손님 A 요청 도착</text>
  <!-- GAP bracket -->
  <path d="M 606 356 L 606 366 L 704 366 L 704 356" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="384" font-size="16" font-weight="700" fill="#dc2626" text-anchor="middle">GAP</text>

  <text x="935" y="318" font-size="19" font-weight="700" fill="#b91c1c">헛질문으로 CPU 낭비</text>
  <text x="935" y="344" font-size="17" fill="#374151">쉬엄쉬엄 물으면</text>
  <text x="935" y="364" font-size="17" fill="#374151">도착과 확인 사이 지연(GAP)</text>

  <!-- ===== Row 3: multiplexing ===== -->
  <rect x="20" y="414" width="1160" height="130" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="40" y="470" font-size="24" font-weight="700" fill="#065f46">③ 커널이 알려줌</text>
  <text x="40" y="496" font-size="19" fill="#047857">I/O 멀티플렉싱 (우리 설계)</text>
  <text x="290" y="483" font-size="16" fill="#374151">워커 1개</text>

  <g font-size="16" text-anchor="middle">
    <rect x="410" y="464" width="194" height="28" rx="5" fill="#e0e7ff"/><text x="507" y="483" fill="#3730a3">잠 (epoll_wait)</text>
    <rect x="606" y="464" width="60" height="28" rx="5" fill="#3b82f6"/><text x="636" y="483" fill="#fff">A 처리</text>
    <rect x="668" y="464" width="104" height="28" rx="5" fill="#e0e7ff"/><text x="720" y="483" fill="#3730a3">잠</text>
    <rect x="774" y="464" width="60" height="28" rx="5" fill="#3b82f6"/><text x="804" y="483" fill="#fff">C 처리</text>
    <rect x="836" y="464" width="40" height="28" rx="5" fill="#e0e7ff"/><text x="856" y="483" fill="#3730a3">잠</text>
  </g>
  <path d="M 598 448 l 16 0 l -8 12 z" fill="#dc2626"/>
  <text x="606" y="440" font-size="15" fill="#dc2626" text-anchor="middle">손님 A 요청 도착 → 커널이 깨움</text>
  <path d="M 766 448 l 16 0 l -8 12 z" fill="#dc2626"/>
  <text x="800" y="440" font-size="15" fill="#dc2626" text-anchor="middle">손님 C 요청 도착</text>

  <text x="935" y="464" font-size="19" font-weight="700" fill="#047857">헛질문 없음 · 바로 처리</text>
  <text x="935" y="490" font-size="17" fill="#374151">도착한 연결만 골라서 처리</text>
  <text x="935" y="510" font-size="17" fill="#374151">워커 4개로 많은 연결</text>

  <!-- time axis -->
  <line x1="410" y1="562" x2="890" y2="562" stroke="#9ca3af" stroke-width="2"/>
  <path d="M 890 562 l -10 -6 l 0 12 z" fill="#9ca3af"/>
  <text x="900" y="567" font-size="17" fill="#6b7280">시간</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
