name: CI

on:
  push:
    branches: [main, eungi-dev]
  pull_request:
    branches: [main, eungi-dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make integration

      - name: Edge cases
        run: make edge-cases
